name: Experimental defrag qualification

on:
  push:
    paths:
      - '.github/workflows/defrag.yml'
      - 'defrag/**'
      - 'include/**'
      - 'lib/**'
      - 'fsck/**'
      - 'mkfs/**'
      - 'dump/**'
      - 'tests/defrag/**'
      - 'tests/junit_report.py'
      - 'tests/test_junit_report.py'
  pull_request:
    paths:
      - '.github/workflows/defrag.yml'
      - 'defrag/**'
      - 'include/**'
      - 'lib/**'
      - 'fsck/**'
      - 'mkfs/**'
      - 'dump/**'
      - 'tests/defrag/**'
      - 'tests/junit_report.py'
      - 'tests/test_junit_report.py'
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete rootless qualification program
        type: boolean
        default: false
      driver:
        description: Run the privileged disposable loop-image tests
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 0'

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libblkid-dev xz-utils xxd
      - name: Validate JUnit evidence conversion
        run: python3 -m unittest discover -s tests -p 'test_junit_report.py' -v
      - name: Run baseline and repaired smoke qualification
        env:
          CC: ${{ matrix.compiler }}
        run: |
          python3 tests/defrag/qualify.py \
            --out "defrag-ci-smoke-${{ matrix.compiler }}"
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile defrag \
            --input "defrag-ci-smoke-${{ matrix.compiler }}" \
            --output "defrag-ci-smoke-${{ matrix.compiler }}/junit.xml" \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 tests/defrag/manifest.py "defrag-ci-smoke-${{ matrix.compiler }}"
      - name: Publish defrag smoke test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Defrag smoke (${{ matrix.compiler }})
          path: defrag-ci-smoke-${{ matrix.compiler }}/junit.xml
          reporter: java-junit
          report-title: Defrag smoke qualification (${{ matrix.compiler }})
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - name: Upload qualification test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defrag-smoke-${{ matrix.compiler }}
          path: defrag-ci-smoke-${{ matrix.compiler }}/
          retention-days: 14

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libblkid-dev xz-utils xxd
      - name: Build instrumented binaries
        run: |
          mkdir defrag-ci-sanitize
          python3 tests/defrag/build.py --sanitize \
            --out defrag-ci-sanitize/build
          echo "DEFRAG_ASAN_RUNTIME=$(cc -print-file-name=libasan.so)" >> "$GITHUB_ENV"
      - name: Run instrumented regression and image tests
        run: |
          python3 tests/defrag/regressions.py \
            --binary defrag-ci-sanitize/build/defrag.exfat \
            --mkfs defrag-ci-sanitize/build/mkfs.exfat \
            --fault defrag-ci-sanitize/build/fault.so \
            --out defrag-ci-sanitize/regressions
          python3 tests/defrag/negative.py \
            --build defrag-ci-sanitize/build \
            --out defrag-ci-sanitize/negative
          python3 tests/defrag/transaction_regressions.py \
            --build defrag-ci-sanitize/build \
            --out defrag-ci-sanitize/transactions
          python3 tests/defrag/run.py \
            --build defrag-ci-sanitize/build \
            --cases 16 --operations 1000 \
            --out defrag-ci-sanitize/model
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile defrag \
            --input defrag-ci-sanitize \
            --output defrag-ci-sanitize/junit.xml \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 tests/defrag/manifest.py defrag-ci-sanitize
      - name: Publish defrag sanitizer test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Defrag sanitizer qualification
          path: defrag-ci-sanitize/junit.xml
          reporter: java-junit
          report-title: Defrag sanitizer qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - name: Upload sanitizer test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defrag-sanitizers
          path: defrag-ci-sanitize/
          retention-days: 14

  full:
    name: Full rootless qualification
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libblkid-dev xz-utils xxd
      - name: Run complete rootless qualification
        run: |
          python3 tests/defrag/qualify.py --full --jobs 2 \
            --out defrag-ci-full
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile defrag \
            --input defrag-ci-full \
            --output defrag-ci-full/junit.xml \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 tests/defrag/manifest.py defrag-ci-full
      - name: Publish full defrag test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Defrag full rootless qualification
          path: defrag-ci-full/junit.xml
          reporter: java-junit
          report-title: Defrag full rootless qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - name: Upload full qualification test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defrag-full-rootless
          path: defrag-ci-full/
          retention-days: 30

  driver:
    name: Linux exFAT driver
    if: github.event_name == 'workflow_dispatch' && inputs.driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libblkid-dev xz-utils xxd
      - name: Build test binaries
        run: |
          mkdir defrag-ci-driver
          python3 tests/defrag/build.py --out defrag-ci-driver/build
      - name: Load the Linux exFAT driver
        run: sudo modprobe exfat
      - name: Run ten disposable loop-image workloads
        run: |
          sudo python3 tests/defrag/mounted.py \
            --build defrag-ci-driver/build \
            --seeds 10 --operations 5000 \
            --out defrag-ci-driver/results
      - name: Make test output readable by the artifact service
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" defrag-ci-driver || true
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile defrag \
            --input defrag-ci-driver \
            --output defrag-ci-driver/junit.xml \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 tests/defrag/manifest.py defrag-ci-driver
      - name: Publish Linux driver test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Defrag Linux driver qualification
          path: defrag-ci-driver/junit.xml
          reporter: java-junit
          report-title: Defrag Linux driver qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - name: Upload driver test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defrag-linux-driver
          path: defrag-ci-driver/
          retention-days: 30
