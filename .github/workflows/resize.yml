name: Experimental image resize
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run 1000 model seeds with 5000 iterations each
        type: boolean
        default: false
      driver:
        description: Run privileged disposable loop-image qualification
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * 0'
permissions:
  actions: read
  checks: write
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_SEEDS: ${{ (github.event_name == 'schedule' || inputs.full) && '1000' || '28' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and test tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkgconf libblkid-dev python3 xxd
      - name: Build
        run: ./autogen.sh && ./configure --enable-tests --enable-experimental-resize && make -j2
      - name: Validate JUnit evidence conversion
        run: python3 -m unittest discover -s tests -p 'test_junit_report.py' -v
      - name: Existing regressions with checked exit status
        run: |
          mkdir -p "$RUNNER_TEMP/resize-test-output"
          make -C lib check 2>&1 | tee "$RUNNER_TEMP/resize-test-output/lib-check.log"
          python3 resize/tests/regressions.py --output "$RUNNER_TEMP/resize-test-output/upstream"
      - name: Check combined cancellation, commit error, and interrupted undo
        run: python3 resize/tests/cancel_commit.py --output "$RUNNER_TEMP/resize-test-output/compound-cancel"
      - name: Model images and complete small-fixture fault sweep
        run: |
          python3 resize/tests/run.py --seeds "$MODEL_SEEDS" --iterations 5000 \
            --jobs 2 --faults --output "$RUNNER_TEMP/resize-test-output/images"
      - name: Reject partitioned and MBR hybrid images before writes
        run: python3 resize/tests/container.py --output "$RUNNER_TEMP/resize-test-output/containers"
      - name: Check inactive FAT entries and reader counterexamples
        run: python3 resize/tests/nofat.py --output "$RUNNER_TEMP/resize-test-output/inactive-fat"
      - name: Deliver actual Unix cancellation signals
        run: python3 resize/tests/signals.py --output "$RUNNER_TEMP/resize-test-output/signals"
      - name: Sample faults on larger real images
        run: python3 resize/tests/large_faults.py --output "$RUNNER_TEMP/resize-test-output/large-faults"
      - name: Reproduce checker defects on the exact baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(mktemp -d)
          git archive 1647ed54299ae8c4343a5edf40b892307f7e6459 | tar -x -C "$baseline"
          (cd "$baseline" && ./autogen.sh && ./configure && make -j2)
          python3 resize/tests/fsck_regression.py --baseline "$baseline/fsck/fsck.exfat" \
            --output "$RUNNER_TEMP/resize-test-output/counterexamples"
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile resize \
            --input "$RUNNER_TEMP/resize-test-output" \
            --output "$RUNNER_TEMP/resize-test-output/junit.xml" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish resize image test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Resize image qualification
          path: ${{ runner.temp }}/resize-test-output/junit.xml
          reporter: java-junit
          report-title: Resize image qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-image-test-output
          path: ${{ runner.temp }}/resize-test-output/
          retention-days: 7
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkgconf libblkid-dev python3 xxd
      - run: ./autogen.sh && ./configure --enable-tests --enable-experimental-resize && make -j2
      - run: python3 resize/tests/run.py --sanitize --library-only --output "$RUNNER_TEMP/resize-test-output/sanitizers"
      - run: python3 resize/tests/regressions.py --sanitize --output "$RUNNER_TEMP/resize-test-output/fsck-sanitizers"
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile resize \
            --input "$RUNNER_TEMP/resize-test-output" \
            --output "$RUNNER_TEMP/resize-test-output/junit.xml" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish resize sanitizer test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Resize sanitizer qualification
          path: ${{ runner.temp }}/resize-test-output/junit.xml
          reporter: java-junit
          report-title: Resize sanitizer qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-sanitizer-test-output
          path: ${{ runner.temp }}/resize-test-output/
          retention-days: 7
  driver:
    if: github.event_name == 'workflow_dispatch' && inputs.driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkgconf libblkid-dev python3
      - run: ./autogen.sh && ./configure --enable-tests --enable-experimental-resize && make -j2
      - run: sudo modprobe exfat
      - name: Linux driver, ten seeds and 5000 real workload iterations per seed
        run: |
          sudo python3 resize/tests/driver.py --require --seeds 10 --iterations 5000 \
            --output "$RUNNER_TEMP/resize-test-output/driver"
      - name: Make driver test output readable by the artifact uploader
        if: always()
        run: if [ -d "$RUNNER_TEMP/resize-test-output" ]; then sudo chmod -R a+rX "$RUNNER_TEMP/resize-test-output"; fi
      - name: Generate descriptive JUnit report
        if: always()
        run: |
          python3 tests/junit_report.py --profile resize \
            --input "$RUNNER_TEMP/resize-test-output" \
            --output "$RUNNER_TEMP/resize-test-output/junit.xml" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish Linux driver test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Resize Linux driver qualification
          path: ${{ runner.temp }}/resize-test-output/junit.xml
          reporter: java-junit
          report-title: Resize Linux driver qualification
          use-actions-summary: false
          list-suites: all
          list-tests: all
          fail-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resize-driver-test-output
          path: ${{ runner.temp }}/resize-test-output/
          retention-days: 7
